version: '3.8'

services:
  # 1. Reverse Proxy / Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    restart: always

  # 2. API Worker 1
  api1:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  # 3. API Worker 2 (Load Balanced)
  api2:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  # 4. PostgreSQL Database for Shared Context
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cric_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 5. Redis for Rate Limiting API requests
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
